{%- if page.sidebar.nav -%}
  <div class="sidebar-toc-wrapper">
    <div class="sidebar-toc">
      {%- assign _sidebar_nav = site.data.navigation[page.sidebar.nav] -%}
      {%- if _sidebar_nav -%}
      <div class="sidebar-profile">
        <div class="sidebar-profile-image">
          <img src="{{ '/assets/images/profile_pic.jpg' | relative_url }}" alt="{{ site.author.name }}" />
        </div>
        <div class="sidebar-profile-name">
          <h1>{{ site.author.name }}</h1>
        </div>
        <div class="sidebar-profile-description">
          <p>{{ site.author.bio }}</p>
        </div>
      </div>
      <ul class="toc">
        {%- for _item in _sidebar_nav -%}
          <li class="toc-item{% if _item.lang-switch %} toc-item--lang{% endif %}">
            <a href="{{ _item.url | relative_url }}" class="toc-text">{{ _item.title }}</a>
          </li>
        {%- endfor -%}
      </ul>
      {%- endif -%}
    </div>
  </div>
{%- endif -%}
