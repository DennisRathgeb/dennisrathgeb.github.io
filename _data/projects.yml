  de:
    title: "NalpSolar BuildTrack — Chrome-Extension für Solarpark-Baustelle"
    summary: "Chrome-Extension mit SharePoint-Anbindung und MapLibre-Karte zur Echtzeit-Visualisierung der Solarpark-Baustelle NalpSolar bei STRABAG. Multi-Shell-Architektur (Chrome, SPFx, PCF) mit integriertem KI-Assistenten."
  en:
    title: "NalpSolar BuildTrack — Chrome extension for a solar-park build"
    summary: "Chrome extension with SharePoint integration and a MapLibre map for real-time visualization of the NalpSolar solar-park construction site at STRABAG. Multi-shell architecture (Chrome, SPFx, PCF) with an integrated AI assistant."

- slug: thermaltrack
  image: /assets/images/projects/thermaltrack/cover.jpg
  tags: [python, typescript, machine-learning, fastapi, django, postgis, maplibre, react, gaussian-additive-model, gis, paragliding, bachelor-thesis, zhaw, fullstack]
  de:
    title: "ThermalGuide — ML-Vorhersage von Thermik und Windfeldern aus GPS-Gleitschirmdaten"
    summary: "Bachelorarbeit an der ZHAW: Full-Stack-System, das aus GPS-Gleitschirmflügen latente Flugzustände via MAP-Schätzung rekonstruiert und damit ein physikalisch strukturiertes, multiplikatives GAM zur Vorhersage von Vertikalwind und Windfeldern trainiert."
  en:
    title: "ThermalGuide — ML prediction of thermals and wind fields from paragliding GPS data"
    summary: "Bachelor's thesis at ZHAW: a full-stack system that recovers latent flight states from GPS paragliding trajectories via MAP estimation and uses them to train a physics-structured multiplicative GAM for vertical-wind and wind-field prediction."

