## Project catalog. Add one entry per project.
## `slug` controls the URL: /projekte/<slug>/ (DE) and /en/projects/<slug>/ (EN).
## Detail pages live in content/de/projects/<slug>.md and content/en/projects/<slug>.md.
##
## Schema:
##   slug:    URL slug (kebab-case)
##   image:   path under /assets/images/
##   tags:    optional list for filtering later
##   de:      { title, summary }  ← shown on DE listing
##   en:      { title, summary }  ← shown on EN listing

- slug: nalps-chrome-extension
