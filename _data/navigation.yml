## Navigation groups — one per language.
## Pages reference these by name via `sidebar: { nav: nav-de }` in frontmatter.
## Note: the home page (/) is a custom 1-pager with its own nav; these groups
## are used by the theme's header/sidebar on the other pages (/projekte/ and
## per-project detail pages).

nav-de:
  - title: Projekte
    url: /projekte/
  - title: Über mich
    url: /#about
  - title: Kontakt
    url: /#contact
  - title: EN
    url: /en/
    lang-switch: true

nav-en:
  - title: Projects
    url: /en/projects/
  - title: About
    url: /en/#about
  - title: Contact
    url: /en/#contact
  - title: DE
    url: /
    lang-switch: true

## Header navs (shown across the top on theme-driven pages)
global-de:
  - titles:
      de: Projekte
    url: /projekte/
  - titles:
      de: Über mich
    url: /#about
  - titles:
      de: Kontakt
    url: /#contact

global-en:
  - titles:
      en: Projects
    url: /en/projects/
  - titles:
      en: About
    url: /en/#about
  - titles:
      en: Contact
    url: /en/#contact

## Empty / utility nav groups
empty:
  - title:
    url:

## Per-project "back" nav
project-de:
  - title: Zurück zu den Projekten
    url: /projekte/
    key: project

project-en:
  - title: Back to projects
    url: /en/projects/
    key: project
