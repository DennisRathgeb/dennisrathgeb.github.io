## Navigation groups — one per language.
## Pages reference these by name via `sidebar: { nav: nav-de }` in frontmatter.

nav-de:
  - title: Projekte
    url: /projekte/
  - title: Lebenslauf
    url: /lebenslauf/
  - title: Kontakt
    url: /kontakt/
  - title: EN
    url: /en/
    lang-switch: true

nav-en:
  - title: Projects
    url: /en/projects/
  - title: Resume
    url: /en/resume/
  - title: Contact
    url: /en/contact/
  - title: DE
    url: /
    lang-switch: true

## Header navs (shown across the top)
global-de:
  - titles:
      de: Projekte
    url: /projekte/
  - titles:
      de: Lebenslauf
    url: /lebenslauf/
  - titles:
      de: Kontakt
    url: /kontakt/

global-en:
  - titles:
      en: Projects
    url: /en/projects/
  - titles:
      en: Resume
    url: /en/resume/
  - titles:
      en: Contact
    url: /en/contact/

## Empty / utility nav groups
empty:
  - title:
    url:

